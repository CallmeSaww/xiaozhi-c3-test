name: Build ESP32-C3 Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build XiaoZhi ESP32-C3 (xmini-c3)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build xmini-c3 variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py main/boards/xmini/c3 --name xmini-c3

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-c3-dasaimochi-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/*.bin
