name: Build ESP32-C3 Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build XiaoZhi ESP32-C3 Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Build firmware with idf.py
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          source $IDF_PATH/export.sh
          idf.py set-target esp32c3
          echo "CONFIG_BOARD_TYPE_XMINI_C3=y" >> sdkconfig
          echo "CONFIG_PM_ENABLE=y" >> sdkconfig
          echo "CONFIG_FREERTOS_USE_TICKLESS_IDLE=y" >> sdkconfig
          echo "CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y" >> sdkconfig
          idf.py build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-c3-dasaimochi-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/xiaozhi.bin
            build/flasher_args.json
